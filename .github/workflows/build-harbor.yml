name: Build & Push to Harbor

on:
  push:
    branches:
      - zolty/main
      - zolty/*
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.k3s.internal.strommen.systems
  HARBOR_PROJECT: staging
  IMAGE_NAME: wiki

jobs:
  test:
    name: Unit Tests
    runs-on: [self-hosted, k3s, linux, amd64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run renderer unit tests
        run: node_modules/.bin/jest server/modules/rendering/html-mermaid --no-coverage

  build:
    name: Build & Push
    runs-on: [self-hosted, k3s, linux, amd64]
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=sha-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "Image tag: sha-${SHA_SHORT}"

      - name: Disable DEV flag + set version
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get install -y jq || apk add --no-cache jq
          fi
          mv package.json pkg-temp.json
          jq -r '. + {dev:false}' pkg-temp.json > package.json
          rm pkg-temp.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: robot$ci-push
          password: ${{ secrets.HARBOR_PUSH_TOKEN }}

      - name: Build and push image (amd64-only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dev/build/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:latest
